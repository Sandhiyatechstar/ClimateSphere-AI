<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer orbital ring -->
  <circle cx="24" cy="24" r="21" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Middle atmosphere ring -->
  <circle cx="24" cy="24" r="16" stroke="#2563eb" stroke-width="2" opacity="0.8"/>
  <!-- Core globe -->
  <circle cx="24" cy="24" r="11" fill="url(#coreGradient)"/>
  <!-- Latitude / Longitude lines -->
  <ellipse cx="24" cy="24" rx="11" ry="4" stroke="#cffafe" stroke-width="1" opacity="0.5"/>
  <ellipse cx="24" cy="24" rx="4" ry="11" stroke="#cffafe" stroke-width="1" opacity="0.5"/>
  <!-- AI Sparkle / Sensor node -->
  <circle cx="33" cy="15" r="2.5" fill="#22d3ee"/>
  <circle cx="33" cy="15" r="4.5" stroke="#22d3ee" stroke-width="0.75" opacity="0.7"/>
  <!-- Gradients -->
  <defs>
    <linearGradient id="coreGradient" x1="13" y1="13" x2="35" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7"/>
      <stop offset="0.5" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
</svg>
