# ═══════════════════════════════════════════════════════════════════════════════
# ClimateSphere AI – Netlify Frontend Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA History API Fallback:
# Directs all non-asset routes to /index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Security Headers for Static Assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Long-term Caching for Hashed Production Assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
